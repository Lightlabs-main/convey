name: Convey CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Operator script typecheck
        run: pnpm scripts:typecheck
      - name: Gateway typecheck
        run: pnpm relayer:typecheck
      - name: MCP server typecheck
        run: pnpm mcp:typecheck
      - name: Operator script syntax
        run: pnpm scripts:syntax
      - name: Production build
        run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests
        run: forge test -vv
